    - trainer.nnodes=1
    - trainer.save_freq=10
    - trainer.test_freq=10
    - trainer.max_actor_ckpt_to_keep=1
    - trainer.max_critic_ckpt_to_keep=1
    - trainer.resume_mode=auto
    - trainer.log_val_generations=2
    - algorithm.use_kl_in_reward=false
    - algorithm.norm_type=role
    - reward_model.policy_rs=true
    - actor_rollout_ref.rollout.rollout_type=pag
    - trainer.experiment_name=qwen1p5b_pag_2gpu
    - trainer.total_epochs=40
    - trainer.default_local_dir=/mnt/data/checkpoints/pag-score-smoke/PAG/qwen1p5b_pag_2gpu
    - trainer.val_before_train=true
    - trainer.total_training_steps=1
    - trainer.val_before_train=false
    - trainer.test_freq=-1
    - trainer.save_freq=-1
    - data.max_prompt_length=512
    - data.max_response_length=192
    - actor_rollout_ref.actor.fsdp_config.param_offload=false
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=false
  job:
    name: main_ppo
    chdir: null
    override_dirname: actor_rollout_ref.actor.clip_ratio_high=0.28,actor_rollout_ref.actor.clip_ratio_low=0.2,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.optimizer_offload=false,actor_rollout_ref.actor.fsdp_config.optimizer_offload=true,actor_rollout_ref.actor.fsdp_config.param_offload=false,actor_rollout_ref.actor.fsdp_config.param_offload=true,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.optim.lr_warmup_steps_ratio=0,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=2048,actor_rollout_ref.actor.ppo_mini_batch_size=2,actor_rollout_ref.actor.use_dynamic_bsz=true,actor_rollout_ref.actor.use_kl_loss=false,actor_rollout_ref.model.path=/mnt/data/models/Qwen2.5-1.5B-Instruct,actor_rollout_ref.model.use_remove_padding=true,actor_rollout_ref.ref.fsdp_config.param_offload=true,actor_rollout_ref.rollout.enforce_eager=true,actor_rollout_ref.rollout.free_cache_engine=false,actor_rollout_ref.rollout.gpu_memory_utilization=0.20,actor_rollout_ref.rollout.max_num_batched_tokens=2048,actor_rollout_ref.rollout.n=1,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.num_turns=2,actor_rollout_ref.rollout.rollout_type=pag,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.top_k=10000,actor_rollout_ref.rollout.val_kwargs.do_sample=true,actor_rollout_ref.rollout.val_kwargs.n=1,actor_rollout_ref.rollout.val_kwargs.num_turns=2,actor_rollout_ref.rollout.val_kwargs.temperature=0.6,actor_rollout_ref.rollout.val_kwargs.top_k=-1,actor_rollout_ref.rollout.val_kwargs.top_p=0.95,algorithm.adv_estimator=gae,algorithm.norm_type=role,algorithm.use_kl_in_reward=false,critic.model.fsdp_config.optimizer_offload=true,critic.model.fsdp_config.param_offload=true,critic.model.path=/mnt/data/models/Qwen2.5-1.5B-Instruct,critic.model.use_remove_padding=true,critic.optim.lr=2e-6,critic.ppo_max_token_len_per_gpu=2048,critic.use_dynamic_bsz=true,data.filter_overlong_prompts=true,data.max_prompt_length=1024,data.max_prompt_le