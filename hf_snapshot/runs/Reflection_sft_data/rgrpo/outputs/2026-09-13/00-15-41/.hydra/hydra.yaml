    - actor_rollout_ref.rollout.free_cache_engine=True
    - actor_rollout_ref.rollout.temperature=0.7
    - actor_rollout_ref.rollout.top_p=0.95
    - actor_rollout_ref.rollout.val_kwargs.n=1
    - algorithm.adv_estimator=grpo
    - algorithm.use_kl_in_reward=False
    - custom_reward_function.name=compute_math_score
    - custom_reward_function.path=/mnt/data/runs/Reflection_sft_data/rgrpo/core_rgrpo.py
    - reward_model.reward_manager=naive
    - env.env_name=none
    - trainer.logger=['console']
    - trainer.project_name=math12000
    - trainer.experiment_name=vanilla_grpo
    - trainer.n_gpus_per_node=1
    - trainer.nnodes=1
    - trainer.val_before_train=False
    - trainer.test_freq=0
    - trainer.save_freq=10
    - trainer.total_training_steps=5
    - trainer.total_epochs=100000
    - trainer.default_local_dir=/mnt/data/runs/Reflection_sft_data/runs/checkpoints/vanilla_grpo_math12000
    - trainer.resume_mode=auto
  job:
    name: main_ppo
    chdir: null
    override_dirname: +actor_rollout_ref.actor.fsdp_config.model_dtype=bf16,+actor_rollout_ref.ref.fsdp_config.model_dtype=bf16,+actor_rollout_ref.rollout.k_continuations=2,+data.dataloader_num_workers=0,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.kl_loss_coef=0.01,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=4096,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=2,actor_rollout_ref.actor.use_dynamic_bsz=True,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.actor.use_torch_compile=False,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/mnt/data/models/Qwen3-4B,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.param_offload=False,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.dtype=bfloat16,actor_rollout_ref.rollout.enable_chunked_prefill=True,actor_rollout_ref.rollout.enforce_eager=True,actor_rollout_ref.rollout.engine_kwargs.vllm.swap_space=0,actor_rollout_ref.rollout.free_cache_engine=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.55,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.max_model_len=2048,actor_rollout_ref.rollout.max_num_batched_tokens=4096,actor_rollout_ref.rollout.max_num_seqs=16,actor_rollout_ref.rollout.n=1,actor_rollout_ref.rollout.temperature=0.7,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.top_p=0.95,actor_rollout_ref.rollout.val_kwargs.n=1,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,custom_reward_function.name=compute_math_score,custom_reward_function.path=/mnt/data/runs/Reflection_sft_data/rgrpo/core_rgrpo.py,data.max_prompt_length=384,data.max_response_length=512,data.prompt_key=question,data.return_raw_chat=True,data.reward_fn_key=data_source,data.train_batch_size=4,data.train_files=/mnt/data/runs/Reflection_sft_data/rl_data/math12000_pool/math12000_pool.parquet,data.truncation=left,data.val_batch_size=8,data.val_files=/mnt/data/runs/Reflection_sft_data/rl_data/math12000_pool/math12000_pool.parquet,env.env_name=none,env.rollout.n=4,ray_init.num_cpus=4,ray_init.object_store_memory=1073741824,reward_model.reward_manager=naive,trainer.default_local_dir=/mnt/data/runs/Reflection_sft_data/runs/checkpoints/vanilla_grpo_math12000,trainer.experiment_name=vanilla_grpo,trainer.logger=['console'],trainer.n_gpus_per_node=1,trainer.nnodes=1,trainer.project_name=math12000,trainer.resume_mode=auto,trainer.save_freq=10,trainer.test_freq=0,trainer.total_epochs=100000,trainer.total_training_steps=5,trainer.val_before_train=False
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.6
    version_base: '1.3'
    cwd: /mnt/data/runs/Reflection_sft_data/rgrpo
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/data/runs/Reflection_sft_data/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mnt/data/runs/Reflection_sft_data/rgrpo/outputs/2026-09-13/00-15-41
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
